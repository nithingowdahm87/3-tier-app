# Nightly drift detection for ALL environments (dev / stage / prod)
# Runs terraform plan against real AWS infra every night at 2 AM UTC (7:30 AM IST).
# If drift is detected (plan has changes), opens a GitHub Issue automatically.
# Closes the issue automatically on the next clean run.
#
# Auth: OIDC keyless authentication — no static AWS keys needed.
# Required IAM role: arn:aws:iam::ACCOUNT_ID:role/github-actions-terraform
#
# CHANGE from previous version:
#   - Upgraded hashicorp/setup-terraform from @v3 to @v4 (consistent with pipeline)
#   - Expanded from prod-only to a matrix covering dev + stage + prod

name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC = 7:30 AM IST daily
  workflow_dispatch:       # manual trigger for on-demand drift check
    inputs:
      environment:
        description: 'Environment to check (dev | stage | prod | all)'
        required: false
        default: 'all'

permissions:
  contents: read
  issues: write          # open/close drift issues
  id-token: write        # OIDC token generation

env:
  TF_VERSION: "~> 1.10"
  AWS_REGION: us-east-1
  OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN }}
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}

jobs:
  drift-check:
    name: "Drift Check (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # check all envs even if one fails
      matrix:
        environment: [dev, stage, prod]
        # On manual dispatch with a specific env, skip others
        # (GitHub Actions doesn't support dynamic matrix exclusion natively;
        #  the filter below uses an if-guard on each job instead)

    steps:
      - name: Skip if manual dispatch selected a different env
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment != 'all' &&
          github.event.inputs.environment != matrix.environment
        run: echo "Skipping ${{ matrix.environment }} — manual run targeted ${{ github.event.inputs.environment }}" && exit 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.environment == 'prod' && 'main' || matrix.environment == 'stage' && 'stage' || 'develop' }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-drift-${{ matrix.environment }}-${{ github.run_id }}

      # Upgraded from @v3 to @v4 — consistent with terraform-pipeline.yml
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        run: |
          cat > ci-backend.hcl <<EOF
          bucket       = "${{ env.TF_BACKEND_BUCKET }}"
          region       = "${{ env.AWS_REGION }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=ci-backend.hcl

      - name: Terraform Plan (drift detection)
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file=environments/${{ matrix.environment }}/terraform.tfvars \
            -detailed-exitcode \
            -no-color 2>&1 | tee drift_output.txt
          TF_EXIT=${PIPESTATUS[0]}
          echo "EXIT_CODE=${TF_EXIT}" >> $GITHUB_OUTPUT
          set -e
          # terraform plan -detailed-exitcode exit codes:
          # 0 = no changes (no drift)
          # 1 = error
          # 2 = changes detected (drift!)

      - name: Open drift issue if changes detected
        if: steps.plan.outputs.EXIT_CODE == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs  = require('fs');
            const env = '${{ matrix.environment }}';
            const drift = fs.readFileSync('drift_output.txt', 'utf8').slice(0, 60000);
            const date  = new Date().toISOString().split('T')[0];
            const label = `terraform-drift-${env}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title:  `\u26a0\ufe0f Terraform Drift Detected in ${env} (${date})`,
                labels: ['terraform-drift', label],
                body: [
                  `## \u26a0\ufe0f Terraform Drift Detected — \`${env}\``,
                  '',
                  `The nightly drift check found that **${env}** has drifted from Terraform state.`,
                  'This likely means someone made a manual change to AWS resources.',
                  '',
                  '<details><summary>Plan Output (click to expand)</summary>',
                  '',
                  '```hcl',
                  drift,
                  '```',
                  '',
                  '</details>',
                  '',
                  '**Action required \u2014 choose one:**',
                  `1. Run \`terraform apply\` on the \`${env === 'prod' ? 'main' : env}\` branch to reconcile AWS back to IaC state`,
                  '2. Update Terraform code to reflect the intended change, then apply',
                ].join('\n')
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issues.data[0].number,
                body: `\ud83d\udd04 Drift still present in \`${env}\` as of ${date}\n\n<details><summary>Latest Plan</summary>\n\n\`\`\`hcl\n${drift}\n\`\`\`\n</details>`
              });
            }

      - name: Close existing drift issue if no drift
        if: steps.plan.outputs.EXIT_CODE == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const env   = '${{ matrix.environment }}';
            const label = `terraform-drift-${env}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                body: `\u2705 Drift resolved \u2014 \`${env}\` state is clean as of ` + new Date().toISOString()
              });
              await github.rest.issues.update({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Fail job if Terraform errored (exit code 1)
        if: steps.plan.outputs.EXIT_CODE == '1'
        run: |
          echo "Terraform plan encountered an error in ${{ matrix.environment }}. Check the output above."
          exit 1
