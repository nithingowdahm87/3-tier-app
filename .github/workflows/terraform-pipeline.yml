# Multi-branch Terraform pipeline
# Branch strategy:
#   feature/*  -> lint + security (checkov + tfsec + trivy) + validate + plan (dev)
#   develop    -> lint + security (checkov + tfsec + trivy) + validate + plan (dev)
#   stage      -> lint + security + validate + plan + apply (stage) [auto]
#   main       -> lint + security + validate + plan + apply (prod)  [manual approval via GitHub Environment]
#
# Auth: OIDC keyless authentication via aws-actions/configure-aws-credentials@v4
# No static AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY needed.
# Required IAM role: arn:aws:iam::ACCOUNT_ID:role/github-actions-terraform
# Trust policy subject: repo:nithingowdahm87/3-tier-app:*

name: Terraform Multi-Branch Pipeline

on:
  push:
    branches:
      - main
      - stage
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - stage
      - develop

permissions:
  contents: read
  pull-requests: write
  id-token: write   # OIDC token generation

env:
  TF_VERSION: "~> 1.10"   # 1.10+ required for S3 native locking (use_lockfile=true)
  AWS_REGION: us-east-1
  OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN }}        # arn:aws:iam::ACCOUNT:role/github-actions-terraform
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}

jobs:
  # -- 1. LINT -------------------------------------------------------
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

  # -- 2. SECURITY (Checkov + tfsec + Trivy IaC) ---------------------
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (IaC security scanner)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: github_failed_only
          download_external_modules: false

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false

      # Pinned to a specific release tag to prevent silent breakage from upstream changes.
      # Update the tag intentionally when you want to upgrade (do not use @master).
      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@0.32.1
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  # -- 3. VALIDATE ---------------------------------------------------
  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # -- 4. PLAN -------------------------------------------------------
  plan:
    name: "Terraform Plan (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    needs: [lint, security, validate]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve environment from branch
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "TFVARS=environments/prod/terraform.tfvars" >> $GITHUB_OUTPUT
            echo "ENV_NAME=prod"  >> $GITHUB_OUTPUT
            echo "STATE_KEY=prod/terraform.tfstate" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "stage" ]]; then
            echo "TFVARS=environments/stage/terraform.tfvars" >> $GITHUB_OUTPUT
            echo "ENV_NAME=stage" >> $GITHUB_OUTPUT
            echo "STATE_KEY=stage/terraform.tfstate" >> $GITHUB_OUTPUT
          else
            echo "TFVARS=environments/dev/terraform.tfvars" >> $GITHUB_OUTPUT
            echo "ENV_NAME=dev"   >> $GITHUB_OUTPUT
            echo "STATE_KEY=dev/terraform.tfstate" >> $GITHUB_OUTPUT
          fi

      - name: Write backend config
        run: |
          cat > ci-backend.hcl <<EOF
          bucket       = "${{ env.TF_BACKEND_BUCKET }}"
          region       = "${{ env.AWS_REGION }}"
          key          = "${{ steps.env.outputs.STATE_KEY }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=ci-backend.hcl

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=${{ steps.env.outputs.TFVARS }} \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ steps.env.outputs.ENV_NAME }}
          path: |
            tfplan
            plan_output.txt
          retention-days: 5

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(0, 60000);
            const status = '${{ steps.plan.outcome }}';
            const emoji  = status === 'success' ? '\u2705' : '\u274c';
            const env    = '${{ steps.env.outputs.ENV_NAME }}';
            const body   = `## ${emoji} Terraform Plan \`${env}\` -- \`${status}\`\n\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body
            });

      # Guard catches failure AND cancelled/timed-out outcomes — not just 'failure'
      - name: Fail if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1

  # -- 5. APPLY - stage (auto) ---------------------------------------
  apply-stage:
    name: "Terraform Apply (stage)"
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/stage' && github.event_name == 'push'
    environment: stage   # no required reviewers -> auto-deploys
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-stage-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        run: |
          cat > ci-backend.hcl <<EOF
          bucket       = "${{ env.TF_BACKEND_BUCKET }}"
          region       = "${{ env.AWS_REGION }}"
          key          = "stage/terraform.tfstate"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=ci-backend.hcl

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-stage

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # -- 6. APPLY - prod (manual approval gate) ------------------------
  apply-prod:
    name: "Terraform Apply (prod)"
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod    # <- set "Required reviewers" in GitHub Settings -> Environments
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-prod-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        run: |
          cat > ci-backend.hcl <<EOF
          bucket       = "${{ env.TF_BACKEND_BUCKET }}"
          region       = "${{ env.AWS_REGION }}"
          key          = "prod/terraform.tfstate"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=ci-backend.hcl

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
